name: CI

# Pushes to main and pull requests. A push to a PR branch is already covered by
# its pull_request run, so building every branch push as well paid twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR makes the running one moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One version failing should not hide the others: the point of the
      # matrix is to learn which ones work, not to stop at the first bad news.
      fail-fast: false
      matrix:
        # Linux carries the version matrix: 3.12 is the floor declared in
        # pyproject, 3.14 the newest. Windows is the shipping platform but costs
        # twice the minutes, so it gets one job, on the newest Python, where
        # missing Windows wheels (pywinpty, pythonnet) show up first.
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The project is developed with uv, and `dev` is a PEP 735 dependency
      # group rather than an extra -- `pip install ".[dev]"` silently installs
      # nothing and the lint and test steps then fail on a missing ruff.
      # setup-uv publishes no moving major tag after v7, hence the full version.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # --locked: a uv.lock that no longer matches pyproject.toml fails here
      # instead of being quietly re-resolved on the runner.
      - name: Install project
        run: uv sync --locked --all-extras --dev --python ${{ matrix.python-version }}

      # The same gate a release is cut behind, so CI and a local
      # `release.py --check` cannot drift apart: pytest, ruff over quickcode,
      # tests and scripts, byte-compilation, `node --check` on every frontend
      # module, `node --test tests/js/*.test.mjs`, and `git diff --check`.
      - name: Release gate
        run: uv run --no-sync python scripts/release.py --check
