<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>QuickCode</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/panels-git.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/trajectory.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/config.css">
<link rel="stylesheet" href="css/help.css">
<link rel="stylesheet" href="css/toon.css">
<link rel="stylesheet" href="css/terminal.css">
<link rel="icon" href="assets/favicon.ico">
<link rel="manifest" href="assets/manifest.webmanifest">
</head>
<body>
<div id="app" class="showing-home">

  <!-- ============================ HOME ============================ -->
  <section id="view-home" class="view view-home">
    <div class="home-inner">
      <header class="home-head">
        <span class="home-logo"><img src="assets/icon.svg" alt="" width="44" height="44"></span>
        <div class="home-titles">
          <h1>QuickCode</h1>
          <p class="home-sub">Local-first coding agent — pick a project to start.</p>
        </div>
        <div class="home-actions">
          <button id="home-help" class="ghost-btn" title="Help — shortcuts and slash commands">?</button>
          <button id="home-settings" class="ghost-btn" title="Settings">⚙</button>
          <button id="home-open" class="btn primary" title="Open a folder as a project">＋ New project</button>
        </div>
      </header>

      <div class="home-sec-head">
        <h2>Recent projects</h2>
        <button id="home-refresh" class="ghost-btn" title="Reload the project list">⟳</button>
      </div>
      <div id="home-projects" class="home-grid"></div>
    </div>
  </section>

  <!-- ========================== WORKSPACE ========================== -->
  <section id="view-workspace" class="view view-workspace">

    <header id="topbar">
      <button id="brand-home" class="brand" title="Back to all projects">
        <span class="brand-mark"><img src="assets/icon.svg" alt="" width="18" height="18"></span>
        <span class="brand-name">QuickCode</span>
      </button>
      <span class="project-chip" id="project-chip" title="project directory">…</span>
      <button class="session-chip" id="session-chip" title="Switch session">New session ▾</button>
      <!-- The recently-used conversations, one click each. They are shortcuts,
           not running sessions: QuickCode streams exactly one conversation at a
           time (js/ws.js keeps one socket and resets the event store on
           connect), so clicking a tab leaves the one you are in. Managing
           sessions — rename, archive, delete, sweep — stays in the chip's
           popover, which is also where the tabs that did not fit are. -->
      <nav class="session-tabs hidden" id="session-tabs" aria-label="Recent sessions"></nav>

      <div class="topbar-actions">
        <!-- Shown only when a newer release exists, and never any other time:
             no spinner while the check runs, nothing at all when it fails.
             Clicking opens Configuration ▸ Install ▸ Updates, which is where
             the whole story is. It is a link, not a nag — it blocks nothing
             and interrupts nothing. -->
        <button id="update-chip" class="ghost-btn update-chip hidden"
                title="A newer QuickCode is available"></button>
        <button id="btn-new-chat" class="ghost-btn" title="New conversation">＋ New</button>
        <button id="btn-panel-toggle" class="ghost-btn" title="Show or hide the side panel">⧉ Panel</button>
        <button id="btn-term-toggle" class="ghost-btn"
                title="Show or hide the terminal (Ctrl+`)">▮ Terminal</button>
        <button id="btn-help" class="ghost-btn" title="Help — shortcuts and slash commands (/help)">?</button>
        <button id="btn-settings" class="ghost-btn" title="Settings">⚙</button>
      </div>
    </header>

    <main id="main">
      <!-- Chat: the main view, always -->
      <section id="chat-pane" class="pane">
        <div id="transcript" class="transcript" aria-live="polite"></div>
        <div id="composer">
          <div id="queue-strip" class="queue-strip hidden"></div>
          <!-- Live activity. The row keeps its height at all times so showing
               and hiding it never moves the transcript; only the opacity
               changes. Hidden from the accessibility tree because the clock
               inside it would be re-announced every second — the sibling live
               region below carries the phase, and only the phase. -->
          <div id="activity" class="activity" data-phase="" aria-hidden="true">
            <span id="activity-glyph" class="act-glyph">✳</span>
            <span id="activity-verb" class="act-verb"></span>
            <span id="activity-meta" class="act-meta"></span>
          </div>
          <span id="activity-live" class="sr-only" aria-live="polite"></span>
          <div class="composer-box">
            <textarea id="input" rows="1" placeholder="Message the agent…"
                      spellcheck="false"></textarea>
            <div class="composer-row">
              <div class="composer-left">
                <button id="mode-pill" class="pill" title="Permission mode">ask ▾</button>
                <button id="model-pill" class="pill" title="Model">…</button>
                <button id="btn-compact" class="pill subtle" title="Compact the conversation">⇊ compact</button>
                <button id="btn-quick-settings" class="pill subtle"
                        title="Quick settings — endpoint, key, theme">⚙ quick</button>
              </div>
              <div class="composer-right">
                <span id="queued-count" class="queued-count hidden"></span>
                <button id="btn-interrupt" class="interrupt-btn hidden" title="Interrupt (Esc)">■ Stop</button>
                <button id="btn-send" class="send-btn" title="Send (Enter)">↑</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div id="panel-grip" class="panel-grip" title="Drag to resize · double-click to reset"></div>

      <!-- One side panel, five tabs -->
      <aside id="side-panel">
        <header class="panel-bar">
          <nav id="panel-tabs" class="panel-tabs" role="tablist"></nav>
          <div class="panel-bar-actions">
            <button id="btn-panel-max" class="ghost-btn" title="Maximize the panel">⛶</button>
            <button id="btn-panel-close" class="ghost-btn" title="Close the panel">✕</button>
          </div>
        </header>

        <div id="panel-stack" class="panel-stack">
          <!-- Trajectory keeps its original markup and ids; trajectory.js binds
               to them once at boot and never learns it moved. -->
          <section class="panel-pane" data-pane="trajectory">
            <div class="traj-toolbar">
              <div class="traj-filters" id="traj-filters"></div>
              <input id="traj-search" class="traj-search" type="search" placeholder="Search events…">
              <button id="traj-fit" class="ghost-btn tj-btn" title="Fit the whole session (F)">⤢ Fit</button>
              <button id="traj-gaps" class="ghost-btn tj-btn is-on" aria-pressed="true"
                      title="Collapse long idle gaps on the time axis">⋯ Gaps</button>
              <button id="traj-follow" class="ghost-btn traj-follow" aria-pressed="true"
                      title="Following the newest event — click to pause">⏸ Follow</button>
              <button id="traj-export" class="ghost-btn" title="Export event log as JSON">⤓ Export</button>
            </div>

            <!-- Time axis + lanes. The gutter and the plot share one width so
                 ticks, bars, crosshair and playhead all line up. -->
            <div id="traj-timeline" class="tj-timeline">
              <div class="tj-head">
                <div class="tj-gutter-pad">time</div>
                <div id="tj-axis" class="tj-axis"></div>
              </div>
              <div class="tj-lanes">
                <div id="tj-gutter" class="tj-gutter"></div>
                <div id="tj-plot" class="tj-plot" tabindex="0" role="application"
                     aria-label="Event timeline — drag to pan, wheel to zoom, click to place the playhead">
                  <div id="tj-bands" class="tj-bands"></div>
                  <div id="tj-cursor" class="tj-cursor hidden"></div>
                  <div id="tj-playhead" class="tj-playhead hidden"></div>
                </div>
              </div>
              <div id="tj-hover" class="tj-hover hidden" role="tooltip"></div>
            </div>

            <div class="traj-body">
              <div id="traj-table" class="tj-table" role="table">
                <div id="tj-spacer" class="tj-spacer"></div>
                <div id="tj-rows" class="tj-rows"></div>
              </div>
              <aside id="traj-detail" class="traj-detail hidden">
                <div class="traj-detail-head">
                  <span id="traj-detail-title">—</span>
                  <button id="traj-detail-close" class="ghost-btn">✕</button>
                </div>
                <nav class="detail-tabs" id="detail-tabs">
                  <button data-tab="summary" class="active">Summary</button>
                  <button data-tab="payload">Payload</button>
                  <button data-tab="result">Result</button>
                  <button data-tab="timing">Timing</button>
                </nav>
                <div id="detail-body" class="detail-body"></div>
              </aside>
            </div>
          </section>

          <section class="panel-pane" data-pane="agents"></section>
          <section class="panel-pane" data-pane="tasks"></section>
          <section class="panel-pane" data-pane="files"></section>
          <section class="panel-pane" data-pane="usage"></section>
        </div>
      </aside>
    </main>

    <!-- The terminal dock. A sibling of #main rather than a child, so it spans
         the transcript *and* the side panel: a shell is wide, and a drawer that
         stopped at the panel's edge would be a column, which is the shape the
         side panel already has. js/terminal/panel.js owns everything inside. -->
    <section id="term-dock" aria-hidden="true" aria-label="Terminal">
      <div id="term-grip" title="Drag to resize · double-click to reset"></div>
      <header class="qt-bar">
        <nav id="term-tabs" class="qt-tabs" role="tablist">
          <button class="qt-tab" data-tab="shell" role="tab"
                  title="A shell of your own, in the project directory">▮ Shell</button>
          <button class="qt-tab" data-tab="agent" role="tab"
                  title="Every command the agent ran — read-only">⌁ Agent commands</button>
        </nav>
        <span id="term-status" data-kind="idle">not started</span>
        <div class="qt-bar-actions">
          <button id="btn-term-clear" class="ghost-btn" title="Clear the screen">⌫ Clear</button>
          <button id="btn-term-restart" class="ghost-btn" title="Kill this shell and start a new one">⟳ Restart</button>
          <button id="btn-term-close" class="ghost-btn" title="Hide the terminal (Ctrl+`)">✕</button>
        </div>
      </header>
      <div class="qt-body">
        <section class="qt-pane" data-pane="shell">
          <!-- tabindex, because the panel only reaches the pty while it has
               focus and a div is not focusable on its own. -->
          <div id="term-screen" tabindex="0" role="application"
               aria-label="Terminal — click to type"></div>
          <div class="qt-hint">This shell is not running. Press ⟳ Restart for a new one.</div>
        </section>
        <section class="qt-pane" data-pane="agent">
          <div id="term-agent"></div>
        </section>
      </div>
    </section>

    <footer id="statusbar">
      <span id="st-state" class="st-seg st-state">idle</span>
      <span id="st-model" class="st-seg" title="Model"></span>
      <span id="st-ctx" class="st-seg" title="Context window usage"></span>
      <span id="st-work" class="st-seg" title="Turns and tool calls this session"></span>
      <span id="st-time" class="st-seg" title="Model time / tool time this session"></span>
      <span id="st-speed" class="st-seg" title="Time to first token · output tokens per second (last turn)"></span>
      <span id="st-cache" class="st-seg" title="Share of input tokens served from cache"></span>
      <span id="st-tokens" class="st-seg" title="Session tokens (in/out)"></span>
      <span id="st-cost" class="st-seg" title="Session cost"></span>
      <span class="st-spacer"></span>
      <span id="st-conn" class="st-seg st-conn" title="Connection">●</span>
    </footer>
  </section>

  <!-- ========================= CONFIGURATION ========================= -->
  <!-- A third top-level view, not a dialog: every page here has a URL, the
       workbench needs three columns, and opening it must never cost the
       workspace its socket. -->
  <section id="view-config" class="view view-config">
    <header id="config-top">
      <button id="config-brand" class="brand" title="Back to what you were doing">
        <span class="brand-mark"><img src="assets/icon.svg" alt="" width="18" height="18"></span>
        <span class="brand-name">QuickCode</span>
      </button>
      <span class="cfg-where">Configuration</span>
      <div class="cfg-search-wrap">
        <input id="cfg-search" type="search" spellcheck="false"
               placeholder="Search everything — plugins, settings, sections, compositions…">
        <div id="cfg-results" class="cfg-results hidden"></div>
      </div>
      <div class="cfg-top-actions">
        <button id="cfg-reload" class="ghost-btn" title="Re-read the plugin kernel">⟳ Reload</button>
        <button id="cfg-done" class="ghost-btn" title="Back to the session">Done ✕</button>
      </div>
    </header>
    <div class="cfg-body">
      <nav id="cfg-rail" class="cfg-rail" aria-label="Configuration sections"></nav>
      <main id="cfg-page" class="cfg-page"></main>
    </div>
  </section>

  <!-- ============================== HELP ============================== -->
  <!-- A fourth top-level view, peer of Configuration: every page has a URL so a
       Settings card can link to the paragraph that explains it, and showing it
       must never cost the workspace its socket. -->
  <section id="view-help" class="view view-help">
    <header id="help-top">
      <button id="help-brand" class="brand" title="Back to what you were doing">
        <span class="brand-mark"><img src="assets/icon.svg" alt="" width="18" height="18"></span>
        <span class="brand-name">QuickCode</span>
      </button>
      <span class="cfg-where">Help</span>
      <div class="hp-top-spacer"></div>
      <div class="hp-top-actions">
        <a class="ghost-btn" href="#/config/agents" title="Open Configuration">⚙ Configuration</a>
        <button id="help-done" class="ghost-btn" title="Back to the session">Done ✕</button>
      </div>
    </header>
    <div class="cfg-body">
      <nav id="help-rail" class="cfg-rail" aria-label="Help sections"></nav>
      <main id="help-page" class="cfg-page"></main>
    </div>
  </section>

  <!-- Modal root -->
  <div id="modal-root"></div>
</div>

<!-- The connection banner. Outside #app on purpose: losing the server while
     you are reading Configuration or Help is exactly when you need to be told,
     and those are views that cover the workspace. It is the third page-level
     aria-live host, alongside the toast stack and the trust banner, and like
     them it is empty and inert until there is something true to say. -->
<div id="conn-host" class="conn-host hidden" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
