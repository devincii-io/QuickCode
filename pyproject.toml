[project]
name = "quickcode"
version = "2.4.0"
description = "A local-first coding agent with a traceable web UI, in the spirit of Claude Code and DeepSeek Harness."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Fichtel Systems", email = "kontakt@fichtelsystems.de" }]
keywords = ["agent", "coding-agent", "llm", "openrouter", "fastapi", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12",
    "openai>=1.40",
    "pydantic>=2.7",
    "httpx>=0.27",
    # Native app window (WebView2 on Windows, which ships with Edge).
    "pywebview>=5.0",
]

[project.optional-dependencies]
pty = ["pywinpty>=2.0; sys_platform == 'win32'"]

[project.scripts]
quickcode = "quickcode.cli:main"
qc = "quickcode.cli:main"

# Launched by the Start-Menu/Desktop shortcut: pythonw, so no console window
# flashes up behind the app window.
[project.gui-scripts]
quickcode-app = "quickcode.cli:main_app"

[project.urls]
Homepage = "https://github.com/devincii-io/QuickCode"
Repository = "https://github.com/devincii-io/QuickCode"
Issues = "https://github.com/devincii-io/QuickCode/issues"
Changelog = "https://github.com/devincii-io/QuickCode/blob/main/CHANGELOG.md"

[dependency-groups]
# pyinstaller builds the frozen onedir app (quickcode.spec). It is a build
# tool, not a runtime dependency: a pip/uv install of the wheel never needs it.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # A hang guard, not a speed limit. Creating an asyncio event loop on Windows
    # builds its self-pipe with socket.socketpair(), which binds a loopback
    # listener and calls accept() with no timeout -- and that accept() blocks
    # forever often enough (roughly one run in three on a loaded machine) to
    # stall a release gate indefinitely. Confirmed with live stack dumps under
    # both starlette's TestClient portal and pytest-asyncio's runner; it is not
    # our code, and the selector loop uses the same self-pipe. A per-test
    # deadline turns "the gate has been running for ten minutes" into a loud
    # failure you can re-run.
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "pyinstaller>=6.10",
    # Also the `pty` extra, so a plain `uv sync` gives a working *build*
    # environment: quickcode.spec refuses to build without pywinpty's ConPTY
    # helpers, and a frozen app missing them falls back to plain subprocesses.
    # The extra stays declared for wheel users, who choose it themselves.
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quickcode"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042", "UP046", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Generously above the slowest honest test (a few seconds); anything that sits
# here for two minutes is the socketpair hang described in the dev group, not
# work. `thread` because signal-based timeouts are POSIX-only -- it dumps every
# thread's stack, which is exactly what you want to see.
timeout = 120
timeout_method = "thread"
# One event loop per module instead of one per test. Each new loop is a fresh
# roll of the socketpair dice described above, and this suite was making ~770 of
# them per run; per module it makes a few dozen. Module rather than session so a
# test that leaks a task can only affect its own file.
asyncio_default_test_loop_scope = "module"
