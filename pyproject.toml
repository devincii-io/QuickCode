[project]
name = "quickcode"
version = "1.0.0"
description = "A local-first coding agent with a traceable web UI, in the spirit of Claude Code and DeepSeek Harness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Fichtel Systems", email = "kontakt@fichtelsystems.de" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12",
    "openai>=1.40",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
pty = ["pywinpty>=2.0; sys_platform == 'win32'"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
quickcode = "quickcode.cli:main"
qc = "quickcode.cli:main"

# Launched by the Start-Menu/Desktop shortcut: pythonw, so no console window
# flashes up behind the browser.
[project.gui-scripts]
quickcode-app = "quickcode.cli:main_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quickcode"]
artifacts = ["quickcode/frontend/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042", "UP046", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
